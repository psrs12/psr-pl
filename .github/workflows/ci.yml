name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - application-management-service
          - pricing-orchestration-service
          - workflow-status-service
          - offer-acceptance-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - application-management-ui
          - pricing-offers-ui
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
