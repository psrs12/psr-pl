name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - application-management-service
          - pricing-orchestration-service
          - workflow-status-service
          - offer-acceptance-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
